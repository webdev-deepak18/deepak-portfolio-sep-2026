<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#040b1a" />
      <stop offset="100%" stop-color="#0a1d42" />
    </linearGradient>
    <linearGradient id="hullGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e285a" />
      <stop offset="100%" stop-color="#0054ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Midnight Squircle Badge -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#00d4ff" stroke-width="1.8" stroke-opacity="0.45" />

  <!-- Ship Navigation Mast & OTIF Green Beacon -->
  <line x1="18" y1="27" x2="18" y2="19" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  <circle cx="18" cy="18" r="2.5" fill="#22c55e" filter="url(#glow)" />

  <!-- Control Bridge / Cabin -->
  <rect x="13" y="27" width="10" height="14" rx="2" fill="#122b5e" stroke="#38bdf8" stroke-width="1.2" />
  <rect x="15" y="30" width="6" height="3" rx="0.8" fill="#00f0ff" />

  <!-- Stacked Freight Containers -->
  <!-- Upper Tier -->
  <rect x="25.5" y="26" width="9" height="7.5" rx="1.5" fill="#00d4ff" stroke="#bae6fd" stroke-width="0.8" />
  <rect x="36" y="26" width="8" height="7.5" rx="1.5" fill="#a855f7" stroke="#e9d5ff" stroke-width="0.8" />

  <!-- Lower Tier -->
  <rect x="25" y="34.5" width="9.5" height="7" rx="1.5" fill="#0054ff" stroke="#93c5fd" stroke-width="0.8" />
  <rect x="35.5" y="34.5" width="9" height="7" rx="1.5" fill="#ff7a1a" stroke="#fed7aa" stroke-width="0.8" />
  <rect x="45.5" y="36.5" width="6.5" height="5" rx="1.2" fill="#00d4ff" stroke="#bae6fd" stroke-width="0.8" />

  <!-- Container Carrier Hull -->
  <path d="M 10 41.5 L 53 41.5 L 45 48.5 L 14 48.5 Z" fill="url(#hullGrad)" stroke="#38bdf8" stroke-width="1.4" stroke-linejoin="round" />

  <!-- Maritime Ocean Wake / Waves -->
  <path d="M 8 52 C 16 50, 24 54, 34 52 C 43 50, 50 54, 57 52" fill="none" stroke="#00f0ff" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 14 56 C 22 55, 29 57, 36 56 C 43 55, 48 57, 52 56" fill="none" stroke="#0054ff" stroke-width="1.8" stroke-linecap="round" opacity="0.75" />
</svg>